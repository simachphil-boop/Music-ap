name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Vesper-${{ github.run_number }}.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Vesper-apk
          path: dist/*.apk

      - name: Publish rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vesper build ${{ github.run_number }}
          body: Automated build from ${{ github.sha }}
          prerelease: true
          files: dist/*.apk
