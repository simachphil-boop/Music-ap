name: Build APK

on:
  push:
    branches: [ "**" ]
    paths-ignore: [ "desktop/**", ".github/workflows/desktop.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/FloyaMusic-${{ github.run_number }}-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/FloyaMusic-${{ github.run_number }}-armv7.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: FloyaMusic-apk
          path: dist/*.apk

      - name: Publish rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Floya Music build ${{ github.run_number }}
          body: |
            Automated build from ${{ github.sha }}
            arm64 — для большинства современных телефонов; armv7 — для старых 32-битных.
          prerelease: true
          files: dist/*.apk
